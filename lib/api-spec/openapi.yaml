openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Reality Compiler API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Design session operations
  - name: messages
    description: Conversational design messages
  - name: stats
    description: Aggregate session statistics
  - name: suppliers
    description: Manufacturing supplier network
  - name: quotes
    description: Manufacturing quotes for design sessions
  - name: orders
    description: Manufacturing orders
  - name: marketplace
    description: Design IP marketplace listings and designer profiles
  - name: me
    description: Current authenticated user
  - name: storage
    description: Hosted object storage (images, avatars)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List design sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignSessionSummary"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new design session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"

  /sessions/stats:
    get:
      operationId: getSessionStats
      tags: [stats]
      summary: Aggregate platform stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStats"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a single design session with messages and latest output
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sessions/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignMessage"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Submit a user message and run the AI design pipeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: Updated session with new output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List manufacturing suppliers
      parameters:
        - in: query
          name: capability
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a single supplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List existing quotes for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: generateQuotes
      tags: [quotes]
      summary: Generate manufacturing quotes for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Generated quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
        "400":
          description: Session not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place a new manufacturing order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderInput"
      responses:
        "201":
          description: |
            Order draft created. If Stripe is configured the response includes
            a `checkoutUrl` the buyer must visit to actually pay; the order
            is not advanced past `pending_payment` until the
            `checkout.session.completed` webhook fires. When Stripe is not
            configured (dev / offline), the embedded `order` is returned
            directly with `paymentStatus = paid`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceOrderResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order with full detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /designer/orders:
    get:
      operationId: listDesignerOrders
      tags: [orders]
      summary: List orders placed against the authenticated user's published designs
      responses:
        "200":
          description: Designer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignerOrderSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/advance:
    post:
      operationId: advanceOrder
      tags: [orders]
      summary: Advance the order to the next manufacturing status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Already at terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyAccount
      tags: [me]
      summary: Soft-delete the current user's account
      description: |
        Soft-deletes the user's sessions, archives their marketplace
        listings, anonymises buyer info on past orders, scrubs the
        profile, and revokes active Clerk sessions. A scheduled purge
        job hard-deletes objects and rows after a 30-day grace window.
      responses:
        "200":
          description: Deletion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/export:
    get:
      operationId: exportMyData
      tags: [me]
      summary: Download a JSON archive of all data tied to the current user
      description: |
        Streams a JSON file containing the user's profile, sessions,
        messages, design outputs, marketplace listings, orders, and
        derived payouts. Returned as an attachment.
      responses:
        "200":
          description: Data archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/connect-account:
    post:
      operationId: createConnectAccount
      tags: [me]
      summary: Start (or refresh) Stripe Connect Express onboarding
      description: |
        Idempotently creates a Stripe Connect Express account for the
        designer (if one doesn't yet exist) and returns a one-shot
        onboarding URL. The frontend should redirect the browser to
        `onboardingUrl`; Stripe will redirect back to `/payouts` on
        completion.
      responses:
        "200":
          description: Onboarding link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectAccountLink"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/connect-status:
    get:
      operationId: getConnectStatus
      tags: [me]
      summary: Inspect current Stripe Connect account status
      description: |
        Returns the live `charges_enabled` / `payouts_enabled` /
        `details_submitted` flags from Stripe so the UI can prompt the
        designer to finish onboarding when needed.
      responses:
        "200":
          description: Connect status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders/{id}/refund:
    post:
      operationId: refundOrder
      tags: [orders]
      summary: Refund (full or partial) a paid order
      description: |
        Admin-only. Authenticated via the `x-admin-token` header against
        the server-side `ADMIN_API_TOKEN`. Triggers a Stripe Refund with
        `reverse_transfer` + `refund_application_fee` so the designer's
        Connect transfer and the platform fee are clawed back
        proportionally. The order's `paymentStatus` and `refundedAmount`
        columns are updated by the `charge.refunded` webhook.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: header
          name: x-admin-token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRefundInput"
      responses:
        "200":
          description: Refund accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRefundResult"
        "400":
          description: Invalid refund request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/purge-deleted:
    post:
      operationId: purgeDeletedAccounts
      tags: [me]
      summary: Hard-delete accounts soft-deleted >30 days ago
      description: |
        Authenticated via the `x-admin-token` header against the
        server-side `ADMIN_API_TOKEN` env var. Intended to be invoked
        by a scheduled job.
      parameters:
        - in: header
          name: x-admin-token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purge summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeSummary"
        "401":
          description: Invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contact:
    post:
      operationId: submitContactMessage
      tags: [me]
      summary: Send a support / abuse / privacy message
      description: |
        Public endpoint. Validates the payload, persists it to the audit
        log so operators can review and respond, and returns 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "202":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAck"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/avatar:
    post:
      operationId: uploadAvatar
      tags: [me]
      summary: Upload a new profile avatar image
      description: |
        Streams an image (PNG, JPEG, or WebP, max 4 MB) directly into
        object storage; the request body is the raw image bytes and the
        `Content-Type` header selects the image type. Returns the updated
        user profile with a hosted `avatarUrl`. The previous avatar
        object is deleted best-effort after a successful upload.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{key}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Stream a stored object (e.g. generated concept image, avatar)
      description: |
        Serves objects uploaded to App Storage with `Cache-Control:
        public, max-age=31536000, immutable`. Object keys are scoped per
        user (e.g. `sessions/<userId>/<sessionId>/<uuid>.png`,
        `avatars/<userId>/<uuid>.png`).
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [me]
      summary: Update the authenticated user's public designer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileInput"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketplace/listings:
    get:
      operationId: listMarketplaceListings
      tags: [marketplace]
      summary: Search and page through published marketplace designs
      description: |
        Filtered, sorted, cursor-paginated list of active marketplace
        listings. `q` searches the title (weighted) and description via a
        Postgres `tsvector` index, with a `pg_trgm` fallback so short or
        misspelt queries still match. `creator` accepts either a user id
        or a handle (without the leading `@`). The opaque `cursor` is
        what the previous page returned in `nextCursor`; pass it back to
        get the next page. `limit` is capped at 50.
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string, maxLength: 200 }
        - in: query
          name: category
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: minPrice
          required: false
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxPrice
          required: false
          schema: { type: number, minimum: 0 }
        - in: query
          name: creator
          required: false
          schema: { type: string, maxLength: 128 }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [popular, recent, price-asc, price-desc]
        - in: query
          name: cursor
          required: false
          schema: { type: string, maxLength: 512 }
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        "200":
          description: Page of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListingsPage"
        "400":
          description: Invalid filter or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: publishListing
      tags: [marketplace]
      summary: Publish a session as a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListingDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not session owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketplace/listings/count:
    get:
      operationId: countMarketplaceListings
      tags: [marketplace]
      summary: Count listings matching the same filters as listMarketplaceListings
      description: |
        Returns the total number of listings that match the given
        filters. Separate from the paginated list so the cheap path can
        skip the count entirely; only call this when you actually need
        a total (e.g. "Showing X of Y results").
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string, maxLength: 200 }
        - in: query
          name: category
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: minPrice
          required: false
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxPrice
          required: false
          schema: { type: number, minimum: 0 }
        - in: query
          name: creator
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListingsCount"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketplace/listings/{id}:
    get:
      operationId: getMarketplaceListing
      tags: [marketplace]
      summary: Get a marketplace listing detail with embedded design output
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unpublishListing
      tags: [marketplace]
      summary: Unpublish a marketplace listing
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketplace/profile/{userId}:
    get:
      operationId: getDesignerProfile
      tags: [marketplace]
      summary: Get a designer profile (listings + total orders)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignerProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CreateSessionInput:
      type: object
      properties:
        prompt:
          type: string
          description: The user's initial natural-language description of the product
      required:
        - prompt

    SendMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    DesignMessage:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - role
        - content
        - createdAt

    BomItem:
      type: object
      properties:
        component:
          type: string
        material:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitCost:
          type: number
        totalCost:
          type: number
      required:
        - component
        - material
        - quantity
        - unit
        - unitCost
        - totalCost

    CostEstimate:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
        currency:
          type: string
        leadTimeDays:
          type: integer
      required:
        - low
        - high
        - currency
        - leadTimeDays

    DesignOutput:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        productName:
          type: string
        category:
          type: string
        summary:
          type: string
        primaryMaterial:
