          type: boolean
        buyerHandle:
          type: ["string", "null"]
        supplierName:
          type: string
        status:
          type: string
          enum: [queued, in_production, quality_check, shipped, delivered]
        quantity:
          type: integer
        totalCost:
          type: number
        payoutAmount:
          type: number
        leadTimeDays:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        refundedAmount:
          type: number
          description: |
            Cumulative refunded amount in dollars. Used by the designer
            payouts page to show net-of-refund earnings.
        netPayoutAmount:
          type: number
          description: |
            `payoutAmount` reduced proportionally by any refund on the order.
            Equals `payoutAmount * (1 - refundedAmount / totalCost)`, floored
            at 0. Use this for designer earnings totals so the UI cannot drift
            from refund state.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - sessionTitle
        - listingId
        - listingTitle
        - listingDeleted
        - supplierName
        - status
        - quantity
        - totalCost
        - payoutAmount
        - leadTimeDays
        - paymentStatus
        - refundedAmount
        - netPayoutAmount
        - createdAt
        - updatedAt

