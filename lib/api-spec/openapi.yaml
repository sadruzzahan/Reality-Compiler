openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Reality Compiler API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Design session operations
  - name: messages
    description: Conversational design messages
  - name: stats
    description: Aggregate session statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List design sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignSessionSummary"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new design session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"

  /sessions/stats:
    get:
      operationId: getSessionStats
      tags: [stats]
      summary: Aggregate platform stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStats"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a single design session with messages and latest output
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sessions/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignMessage"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Submit a user message and run the AI design pipeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: Updated session with new output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CreateSessionInput:
      type: object
      properties:
        prompt:
          type: string
          description: The user's initial natural-language description of the product
      required:
        - prompt

    SendMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    DesignMessage:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - role
        - content
        - createdAt

    BomItem:
      type: object
      properties:
        component:
          type: string
        material:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitCost:
          type: number
        totalCost:
          type: number
      required:
        - component
        - material
        - quantity
        - unit
        - unitCost
        - totalCost

    CostEstimate:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
        currency:
          type: string
        leadTimeDays:
          type: integer
      required:
        - low
        - high
        - currency
        - leadTimeDays

    DesignOutput:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        productName:
          type: string
        category:
          type: string
        summary:
          type: string
        primaryMaterial:
          type: string
        materials:
          type: array
          items:
            type: string
        dimensions:
          type: string
        weightGrams:
          type: ["number", "null"]
        processes:
          type: array
          items:
            type: string
        bom:
          type: array
          items:
            $ref: "#/components/schemas/BomItem"
        costEstimate:
          $ref: "#/components/schemas/CostEstimate"
        imageUrl:
          type: ["string", "null"]
        manufacturingNotes:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - productName
        - category
        - summary
        - primaryMaterial
        - materials
        - dimensions
        - processes
        - bom
        - costEstimate
        - manufacturingNotes
        - createdAt

    DesignSessionSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [generating, ready, error]
        productName:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        primaryMaterial:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        estimatedCostLow:
          type: ["number", "null"]
        estimatedCostHigh:
          type: ["number", "null"]
        messageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
        - messageCount
        - createdAt
        - updatedAt

    DesignSession:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [generating, ready, error]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/DesignMessage"
        latestOutput:
          oneOf:
            - $ref: "#/components/schemas/DesignOutput"
            - type: "null"
      required:
        - id
        - title
        - status
        - createdAt
        - updatedAt
        - messages
        - latestOutput

    MaterialCount:
      type: object
      properties:
        material:
          type: string
        count:
          type: integer
      required:
        - material
        - count

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count

    SessionStats:
      type: object
      properties:
        totalSessions:
          type: integer
        totalDesigns:
          type: integer
        avgCostLow:
          type: number
        avgCostHigh:
          type: number
        totalEstimatedValue:
          type: number
        topMaterials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialCount"
        topCategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        recentSessions:
          type: array
          items:
            $ref: "#/components/schemas/DesignSessionSummary"
      required:
        - totalSessions
        - totalDesigns
        - avgCostLow
        - avgCostHigh
        - totalEstimatedValue
        - topMaterials
        - topCategories
        - recentSessions
