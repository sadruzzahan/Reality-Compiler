openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Reality Compiler API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Design session operations
  - name: messages
    description: Conversational design messages
  - name: stats
    description: Aggregate session statistics
  - name: suppliers
    description: Manufacturing supplier network
  - name: quotes
    description: Manufacturing quotes for design sessions
  - name: orders
    description: Manufacturing orders
  - name: marketplace
    description: Design IP marketplace listings and designer profiles
  - name: me
    description: Current authenticated user
  - name: storage
    description: Hosted object storage (images, avatars)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List design sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignSessionSummary"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new design session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"

  /sessions/stats:
    get:
      operationId: getSessionStats
      tags: [stats]
      summary: Aggregate platform stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStats"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a single design session with messages and latest output
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sessions/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignMessage"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Submit a user message and run the AI design pipeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: Updated session with new output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List manufacturing suppliers
      parameters:
        - in: query
          name: capability
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a single supplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List existing quotes for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: generateQuotes
      tags: [quotes]
      summary: Generate manufacturing quotes for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Generated quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
        "400":
          description: Session not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place a new manufacturing order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order with full detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /designer/orders:
    get:
      operationId: listDesignerOrders
      tags: [orders]
      summary: List orders placed against the authenticated user's published designs
      responses:
        "200":
          description: Designer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignerOrderSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/advance:
    post:
      operationId: advanceOrder
      tags: [orders]
      summary: Advance the order to the next manufacturing status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Already at terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyAccount
      tags: [me]
      summary: Soft-delete the current user's account
      description: |
        Soft-deletes the user's sessions, archives their marketplace
        listings, anonymises buyer info on past orders, scrubs the
        profile, and revokes active Clerk sessions. A scheduled purge
        job hard-deletes objects and rows after a 30-day grace window.
      responses:
        "200":
          description: Deletion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/export:
    get:
      operationId: exportMyData
      tags: [me]
      summary: Download a JSON archive of all data tied to the current user
      description: |
        Streams a JSON file containing the user's profile, sessions,
        messages, design outputs, marketplace listings, orders, and
        derived payouts. Returned as an attachment.
      responses:
        "200":
          description: Data archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/purge-deleted:
    post:
      operationId: purgeDeletedAccounts
      tags: [me]
      summary: Hard-delete accounts soft-deleted >30 days ago
      description: |
        Authenticated via the `x-admin-token` header against the
        server-side `ADMIN_API_TOKEN` env var. Intended to be invoked
        by a scheduled job.
      parameters:
        - in: header
          name: x-admin-token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purge summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeSummary"
        "401":
          description: Invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/avatar:
    post:
      operationId: uploadAvatar
      tags: [me]
      summary: Upload a new profile avatar image
      description: |
        Streams an image (PNG, JPEG, or WebP, max 4 MB) directly into
        object storage; the request body is the raw image bytes and the
        `Content-Type` header selects the image type. Returns the updated
        user profile with a hosted `avatarUrl`. The previous avatar
        object is deleted best-effort after a successful upload.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{key}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Stream a stored object (e.g. generated concept image, avatar)
      description: |
        Serves objects uploaded to App Storage with `Cache-Control:
        public, max-age=31536000, immutable`. Object keys are scoped per
        user (e.g. `sessions/<userId>/<sessionId>/<uuid>.png`,
        `avatars/<userId>/<uuid>.png`).
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [me]
      summary: Update the authenticated user's public designer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileInput"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketplace/listings:
    get:
      operationId: listMarketplaceListings
      tags: [marketplace]
      summary: List published marketplace designs
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [popular, price-asc, price-desc, newest]
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceListingSummary"
    post:
      operationId: publishListing
      tags: [marketplace]
      summary: Publish a session as a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListingDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not session owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketplace/listings/{id}:
    get:
      operationId: getMarketplaceListing
      tags: [marketplace]
      summary: Get a marketplace listing detail with embedded design output
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unpublishListing
      tags: [marketplace]
      summary: Unpublish a marketplace listing
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketplace/profile/{userId}:
    get:
      operationId: getDesignerProfile
      tags: [marketplace]
      summary: Get a designer profile (listings + total orders)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignerProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CreateSessionInput:
      type: object
      properties:
        prompt:
          type: string
          description: The user's initial natural-language description of the product
      required:
        - prompt

    SendMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    DesignMessage:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - role
        - content
        - createdAt

    BomItem:
      type: object
      properties:
        component:
          type: string
        material:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitCost:
          type: number
        totalCost:
          type: number
      required:
        - component
        - material
        - quantity
        - unit
        - unitCost
        - totalCost

    CostEstimate:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
        currency:
          type: string
        leadTimeDays:
          type: integer
      required:
        - low
        - high
        - currency
        - leadTimeDays

    DesignOutput:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        productName:
          type: string
        category:
          type: string
        summary:
          type: string
        primaryMaterial:
          type: string
        materials:
          type: array
          items:
            type: string
        dimensions:
          type: string
        weightGrams:
          type: ["number", "null"]
        processes:
          type: array
          items:
            type: string
        bom:
          type: array
          items:
            $ref: "#/components/schemas/BomItem"
        costEstimate:
          $ref: "#/components/schemas/CostEstimate"
        imageUrl:
          description: URL to a hosted image (object storage URL or null)
          type: ["string", "null"]
        manufacturingNotes:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - productName
        - category
        - summary
        - primaryMaterial
        - materials
        - dimensions
        - processes
        - bom
        - costEstimate
        - manufacturingNotes
        - createdAt

    DesignSessionSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [generating, ready, error]
        productName:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        primaryMaterial:
          type: ["string", "null"]
        thumbnailUrl:
          description: URL to a hosted image (object storage URL or null)
          type: ["string", "null"]
        estimatedCostLow:
          type: ["number", "null"]
        estimatedCostHigh:
          type: ["number", "null"]
        messageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
        - messageCount
        - createdAt
        - updatedAt

    DesignSession:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [generating, ready, error]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/DesignMessage"
        latestOutput:
          oneOf:
            - $ref: "#/components/schemas/DesignOutput"
            - type: "null"
      required:
        - id
        - title
        - status
        - createdAt
        - updatedAt
        - messages
        - latestOutput

    MaterialCount:
      type: object
      properties:
        material:
          type: string
        count:
          type: integer
      required:
        - material
        - count

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count

    SessionStats:
      type: object
      properties:
        totalSessions:
          type: integer
        totalDesigns:
          type: integer
        avgCostLow:
          type: number
        avgCostHigh:
          type: number
        totalEstimatedValue:
          type: number
        topMaterials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialCount"
        topCategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        recentSessions:
          type: array
          items:
            $ref: "#/components/schemas/DesignSessionSummary"
      required:
        - totalSessions
        - totalDesigns
        - avgCostLow
        - avgCostHigh
        - totalEstimatedValue
        - topMaterials
        - topCategories
        - recentSessions

    Supplier:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        location:
          type: string
        country:
          type: string
        capabilities:
          type: array
          items:
            type: string
        materials:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        leadTimeMinDays:
          type: integer
        leadTimeMaxDays:
          type: integer
        pricingMultiplier:
          type: number
        setupFee:
          type: number
        rating:
          type: number
        capacityLevel:
          type: string
          enum: [low, medium, high]
      required:
        - id
        - slug
        - name
        - tagline
        - description
        - location
        - country
        - capabilities
        - materials
        - certifications
        - leadTimeMinDays
        - leadTimeMaxDays
        - pricingMultiplier
        - setupFee
        - rating
        - capacityLevel

    ProcessBreakdownItem:
      type: object
      properties:
        process:
          type: string
        description:
          type: string
        cost:
          type: number
      required:
        - process
        - description
        - cost

    QuoteScoreFactors:
      type: object
      properties:
        processMatch:
          type: number
        materialMatch:
          type: number
        leadTime:
          type: number
        rating:
          type: number
        total:
          type: number
      required:
        - processMatch
        - materialMatch
        - leadTime
        - rating
        - total

    Quote:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        supplier:
          $ref: "#/components/schemas/Supplier"
        unitCost:
          type: number
        setupFee:
          type: number
        totalCost:
          type: number
        leadTimeDays:
          type: integer
        processBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ProcessBreakdownItem"
        scoreFactors:
          $ref: "#/components/schemas/QuoteScoreFactors"
        rank:
          type: integer
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - supplier
        - unitCost
        - setupFee
        - totalCost
        - leadTimeDays
        - processBreakdown
        - scoreFactors
        - rank
        - notes
        - createdAt

    ShippingAddress:
      type: object
      properties:
        recipient:
          type: string
        line1:
          type: string
        line2:
          type: ["string", "null"]
        city:
          type: string
        region:
          type: string
        postalCode:
          type: string
        country:
          type: string
      required:
        - recipient
        - line1
