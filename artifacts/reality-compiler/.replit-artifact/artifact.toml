kind = "web"
previewPath = "/"
title = "Reality Compiler"
version = "1.0.0"
id = "artifacts/reality-compiler"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21345

[services.development]
run = "pnpm --filter @workspace/reality-compiler run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reality-compiler", "run", "build" ]
publicDir = "artifacts/reality-compiler/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21345"
BASE_PATH = "/"
